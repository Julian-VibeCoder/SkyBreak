name: Vacation CI

on:
  push:
    branches: [main, 'story-*', 'fix-*', 'bugfix*']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Build frontend
        run: cd frontend && npm ci && npm run build

      - name: Run tests
        run: |
          # Exclude infra-only tests: a Docker daemon, a Playwright browser,
          # and the JS test dir. The unit/integration suite below must pass.
          python -m pytest tests/ \
            --ignore=tests/frontend \
            --ignore=tests/test_docker_build.py \
            --ignore=tests/test_price_chart_playwright.py -v

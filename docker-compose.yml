version: "3.9"
services:
  app:
    build: .
    volumes: [".:/app", "./skybreak.db:/app/skybreak.db"]
    ports: ["80:80"]
    command: python -m flask --app skybreak/app run --host=0.0.0.0 --port=8000
  frontend:
    image: nginx:alpine
    volumes: ["./frontend:/usr/share/nginx/html:ro"]
    ports: ["8080:80"]

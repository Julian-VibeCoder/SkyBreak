</section>
</main>

<script>
async function loadAirports() {
  try {
    const res = await fetch('/api/airports');
    const data = await res.json();
    const list = document.getElementById('airportList');
    list.innerHTML = '';
    data.forEach(code => {
      const li = document.createElement('li');
      li.className = 'bg-slate-100 rounded px-4 py-3 font-mono text-lg font-semibold flex items-center justify-between';
      li.innerHTML = '<span>' + code + '</span><button onclick="removeAirport(\'' + code + '\')" class="ml-3 text-red-600 hover:text-red-800 font-bold">×</button>';
      list.appendChild(li);
    });
  } catch (e) { console.error(e); }
}
